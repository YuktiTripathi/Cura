openapi: 3.1.0
info:
  title: Cura
  version: 0.1.0
paths:
  /api/v1/chat:
    post:
      summary: Chat
      operationId: chat_api_v1_chat_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/chat/stream:
    post:
      summary: Chat Stream
      operationId: chat_stream_api_v1_chat_stream_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/conversations:
    get:
      summary: List Conversations
      operationId: list_conversations_api_v1_conversations_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ConversationSummary'
                type: array
                title: Response List Conversations Api V1 Conversations Get
  /api/v1/conversations/{conversation_id}:
    get:
      summary: Get Conversation
      operationId: get_conversation_api_v1_conversations__conversation_id__get
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      summary: Delete Conversation
      operationId: delete_conversation_api_v1_conversations__conversation_id__delete
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/documents:
    get:
      summary: List Documents
      operationId: list_documents_api_v1_documents_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListOut'
    post:
      summary: Upload Document
      operationId: upload_document_api_v1_documents_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_document_api_v1_documents_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/documents/{document_id}:
    get:
      summary: Get Document
      operationId: get_document_api_v1_documents__document_id__get
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      summary: Delete Document
      operationId: delete_document_api_v1_documents__document_id__delete
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/feedback:
    post:
      summary: Create Feedback
      operationId: create_feedback_api_v1_feedback_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/me:
    get:
      summary: Me
      operationId: me_api_v1_me_get
      parameters:
      - name: language
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/capabilities:
    get:
      summary: Capabilities
      operationId: capabilities_api_v1_capabilities_get
      parameters:
      - name: language
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/voice:
    post:
      summary: Transcribe
      operationId: transcribe_api_v1_voice_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_transcribe_api_v1_voice_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscribeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/voice/transcribe:
    post:
      summary: Transcribe
      operationId: transcribe_api_v1_voice_transcribe_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_transcribe_api_v1_voice_transcribe_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscribeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/context/{context_type}/{object_id}:
    get:
      summary: Context Reference
      description: Returns an owned, validated reference—never client-provided medical
        values.
      operationId: context_reference_api_v1_context__context_type___object_id__get
      parameters:
      - name: context_type
        in: path
        required: true
        schema:
          type: string
          title: Context Type
      - name: object_id
        in: path
        required: true
        schema:
          type: string
          title: Object Id
      - name: source
        in: query
        required: false
        schema:
          type: string
          default: supershyft
          title: Source
      - name: report_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Report Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextRef'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/health:
    get:
      summary: Api Health
      operationId: api_health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    ApprovedRecommendation:
      properties:
        category:
          type: string
          enum:
          - foods_to_include
          - foods_to_limit
          - meal_patterns
          - lifestyle_actions
          - hydration
          - activity
          - sleep
          - stress
          title: Category
        text:
          type: string
          title: Text
        rationale:
          anyOf:
          - type: string
          - type: 'null'
          title: Rationale
        evidence_codes:
          items:
            type: string
          type: array
          title: Evidence Codes
        policy_status:
          type: string
          const: approved
          title: Policy Status
          default: approved
      type: object
      required:
      - category
      - text
      title: ApprovedRecommendation
    Body_transcribe_api_v1_voice_post:
      properties:
        audio:
          type: string
          contentMediaType: application/octet-stream
          title: Audio
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
        language_mode:
          type: string
          title: Language Mode
          default: auto
      type: object
      required:
      - audio
      title: Body_transcribe_api_v1_voice_post
    Body_transcribe_api_v1_voice_transcribe_post:
      properties:
        audio:
          type: string
          contentMediaType: application/octet-stream
          title: Audio
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
        language_mode:
          type: string
          title: Language Mode
          default: auto
      type: object
      required:
      - audio
      title: Body_transcribe_api_v1_voice_transcribe_post
    Body_upload_document_api_v1_documents_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        conversation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Conversation Id
      type: object
      required:
      - file
      title: Body_upload_document_api_v1_documents_post
    CapabilitiesResponse:
      properties:
        capabilities:
          $ref: '#/components/schemas/MeCapabilities'
        starters:
          $ref: '#/components/schemas/StarterQuestionSet'
      type: object
      required:
      - capabilities
      - starters
      title: CapabilitiesResponse
    ChatMeta:
      properties:
        intent:
          anyOf:
          - type: string
          - type: 'null'
          title: Intent
        answer_depth:
          anyOf:
          - type: string
          - type: 'null'
          title: Answer Depth
        status:
          type: string
          title: Status
          default: ok
        llm_mode:
          type: string
          title: Llm Mode
          default: disabled
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
        detected_language:
          anyOf:
          - type: string
          - type: 'null'
          title: Detected Language
        response_language:
          anyOf:
          - type: string
          - type: 'null'
          title: Response Language
        language_mode:
          anyOf:
          - type: string
          - type: 'null'
          title: Language Mode
        sources_used:
          items:
            type: string
          type: array
          title: Sources Used
        knowledge_scope:
          anyOf:
          - type: string
          - type: 'null'
          title: Knowledge Scope
        sources_requested:
          items:
            type: string
          type: array
          title: Sources Requested
        llm_called:
          type: boolean
          title: Llm Called
          default: false
        supershyft_called:
          type: boolean
          title: Supershyft Called
          default: false
        document_retrieval_called:
          type: boolean
          title: Document Retrieval Called
          default: false
        db_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Db Status
        supershyft_record_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Supershyft Record Count
        safety_flags:
          items:
            type: string
          type: array
          title: Safety Flags
        recommendation_flags:
          items:
            type: string
          type: array
          title: Recommendation Flags
        grounding_flags:
          items:
            type: string
          type: array
          title: Grounding Flags
        escalation:
          anyOf:
          - type: string
          - type: 'null'
          title: Escalation
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
        cache_hit:
          type: boolean
          title: Cache Hit
          default: false
        prompt_version:
          type: string
          title: Prompt Version
          default: cura-v1
        input_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Input Tokens
        output_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Output Tokens
      type: object
      title: ChatMeta
    ChatRequest:
      properties:
        message:
          type: string
          title: Message
        conversation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Conversation Id
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
        language_mode:
          type: string
          title: Language Mode
          default: auto
        document_ids:
          items:
            type: string
          type: array
          title: Document Ids
        context_ref:
          anyOf:
          - $ref: '#/components/schemas/ContextRef'
          - type: 'null'
      type: object
      required:
      - message
      title: ChatRequest
    ChatResponse:
      properties:
        conversation_id:
          type: string
          title: Conversation Id
        answer:
          type: string
          title: Answer
        evidence:
          items:
            $ref: '#/components/schemas/EvidenceItem'
          type: array
          title: Evidence
        follow_ups:
          items:
            $ref: '#/components/schemas/FollowUpSuggestion'
          type: array
          title: Follow Ups
        recommendations:
          items:
            $ref: '#/components/schemas/ApprovedRecommendation'
          type: array
          title: Recommendations
        meta:
          $ref: '#/components/schemas/ChatMeta'
      type: object
      required:
      - conversation_id
      - answer
      title: ChatResponse
    ContextRef:
      properties:
        type:
          type: string
          enum:
          - blood_marker
          - blood_report
          - bio_ai_risk
          - bio_ai_report
          - health_scenario
          - nutrition_item
          - uploaded_document
          title: Type
        source:
          type: string
          enum:
          - supershyft
          - user_uploaded
          title: Source
        marker_code:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Marker Code
        risk_code:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Risk Code
        report_id:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Report Id
        document_id:
          anyOf:
          - type: string
            maxLength: 36
          - type: 'null'
          title: Document Id
      type: object
      required:
      - type
      - source
      title: ContextRef
    ConversationDetail:
      properties:
        id:
          type: string
          title: Id
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        messages:
          items:
            $ref: '#/components/schemas/MessageOut'
          type: array
          title: Messages
      type: object
      required:
      - id
      - messages
      title: ConversationDetail
    ConversationSummary:
      properties:
        id:
          type: string
          title: Id
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        updated_at:
          type: string
          title: Updated At
      type: object
      required:
      - id
      - updated_at
      title: ConversationSummary
    DocumentListOut:
      properties:
        documents:
          items:
            $ref: '#/components/schemas/DocumentOut'
          type: array
          title: Documents
      type: object
      title: DocumentListOut
    DocumentOut:
      properties:
        document_id:
          type: string
          title: Document Id
        filename:
          type: string
          title: Filename
        content_type:
          type: string
          title: Content Type
        file_size:
          type: integer
          title: File Size
        source:
          type: string
          title: Source
          default: user_uploaded
        upload_status:
          type: string
          title: Upload Status
        extraction_status:
          type: string
          title: Extraction Status
        conversation_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Conversation Id
        created_at:
          type: string
          title: Created At
        sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Sha256
        extraction_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Extraction Error
      type: object
      required:
      - document_id
      - filename
      - content_type
      - file_size
      - upload_status
      - extraction_status
      - created_at
      title: DocumentOut
    EvidenceItem:
      properties:
        evidence_id:
          type: string
          title: Evidence Id
        report_id:
          type: string
          title: Report Id
        report_type:
          type: string
          title: Report Type
        report_date:
          type: string
          format: date
          title: Report Date
        marker:
          anyOf:
          - type: string
          - type: 'null'
          title: Marker
        risk_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Risk Code
        source:
          type: string
          title: Source
          default: supershyft
        document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Id
        chunk_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Chunk Id
        filename:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
        page_start:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page Start
        page_end:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page End
        excerpt:
          anyOf:
          - type: string
          - type: 'null'
          title: Excerpt
        value:
          anyOf:
          - type: number
          - type: 'null'
          title: Value
        unit:
          anyOf:
          - type: string
          - type: 'null'
          title: Unit
        reference_range:
          anyOf:
          - type: string
          - type: 'null'
          title: Reference Range
      type: object
      required:
      - evidence_id
      - report_id
      - report_type
      - report_date
      title: EvidenceItem
    FeedbackRequest:
      properties:
        conversation_id:
          type: string
          title: Conversation Id
        message_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Message Id
        rating:
          type: string
          title: Rating
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
      type: object
      required:
      - conversation_id
      - rating
      title: FeedbackRequest
    FollowUpSuggestion:
      properties:
        text:
          type: string
          title: Text
        category:
          type: string
          title: Category
        intent:
          anyOf:
          - type: string
          - type: 'null'
          title: Intent
        requires_personal_context:
          type: boolean
          title: Requires Personal Context
          default: false
        source:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
          default: supershyft
        knowledge_scope:
          type: string
          title: Knowledge Scope
          default: personal
      type: object
      required:
      - text
      - category
      title: FollowUpSuggestion
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    MeCapabilities:
      properties:
        has_blood_report:
          type: boolean
          title: Has Blood Report
          default: false
        has_bio_ai_report:
          type: boolean
          title: Has Bio Ai Report
          default: false
        has_questionnaire:
          type: boolean
          title: Has Questionnaire
          default: false
        has_nutrition:
          type: boolean
          title: Has Nutrition
          default: false
        has_health_scenario:
          type: boolean
          title: Has Health Scenario
          default: false
      type: object
      title: MeCapabilities
    MeResponse:
      properties:
        user_id:
          anyOf:
          - type: string
          - type: integer
          title: User Id
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
        greeting:
          type: string
          title: Greeting
        profile_available:
          type: boolean
          title: Profile Available
          default: false
        capabilities:
          $ref: '#/components/schemas/MeCapabilities'
        starters:
          $ref: '#/components/schemas/StarterQuestionSet'
      type: object
      required:
      - user_id
      - greeting
      title: MeResponse
    MessageOut:
      properties:
        id:
          type: string
          title: Id
        role:
          type: string
          title: Role
        content:
          type: string
          title: Content
        created_at:
          type: string
          title: Created At
      type: object
      required:
      - id
      - role
      - content
      - created_at
      title: MessageOut
    StarterQuestion:
      properties:
        text:
          type: string
          title: Text
        knowledge_scope:
          type: string
          title: Knowledge Scope
        category:
          type: string
          title: Category
      type: object
      required:
      - text
      - knowledge_scope
      - category
      title: StarterQuestion
    StarterQuestionSet:
      properties:
        personal:
          items:
            $ref: '#/components/schemas/StarterQuestion'
          type: array
          title: Personal
        general:
          items:
            $ref: '#/components/schemas/StarterQuestion'
          type: array
          title: General
        personal_unavailable:
          type: boolean
          title: Personal Unavailable
          default: false
      type: object
      title: StarterQuestionSet
    TranscribeResponse:
      properties:
        transcript:
          type: string
          title: Transcript
        detected_language:
          anyOf:
          - type: string
          - type: 'null'
          title: Detected Language
        confidence:
          anyOf:
          - type: number
          - type: 'null'
          title: Confidence
        language_mode:
          type: string
          title: Language Mode
          default: auto
      type: object
      required:
      - transcript
      title: TranscribeResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
